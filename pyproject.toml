[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uav3d"
version = "0.2.0"
description = "UAV terrain and building reconstruction under a fixed compute budget: thin orchestration over ODM and Roofer, with quality-feedback regional refinement"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6", "scipy==1.15.3", "matplotlib==3.10.3", "pandas==2.2.3", "Pillow==11.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
gis = [
  "rasterio==1.5.2",
  "geopandas==1.2.0",
  "pyogrio==0.13.0",
  "shapely==2.2.0",
  "pyproj==3.8.0",
  "laspy[lazrs]>=2.6,<3",
  "psutil==7.2.2",
  "requests==2.34.2",
  "trimesh==5.2.1",
  "mapbox-earcut==2.1.0",
]

[project.scripts]
uav3d = "uav3d.cli:main"
uav3d-app = "uav3d.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
